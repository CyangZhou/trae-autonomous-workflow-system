name: smart-navigation
version: "1.0.0"
description: 智能导航 SKILL - 对抗 LLM 中间信息遗忘
author: LO

triggers:
  keywords:
    - "优化文档"
    - "导航优化"
    - "记忆强化"
    - "规则文档优化"
    - "三明治结构"
    - "文档结构优化"
  conditions:
    - document_length: ">200"
    - has_rules: true
    - user_request_contains: "优化"

execution:
  entry_point: SKILL.md
  protocol:
    - step: 1
      name: "分析原始文档"
      action: "extract_rules_and_structure"
    - step: 2
      name: "生成三明治结构"
      action: "create_sandwich_structure"
    - step: 3
      name: "构建多位置引用"
      action: "build_cross_references"
    - step: 4
      name: "应用视觉标记"
      action: "apply_visual_markers"
    - step: 5
      name: "验证输出"
      action: "validate_output"

quality_metrics:
  middle_content_recall: ">=80%"
  reference_accuracy: ">=90%"
  navigation_success: ">=85%"
  structure_clarity: ">=4.5/5.0"

output:
  format: markdown
  encoding: utf-8
  preserve_original: true
