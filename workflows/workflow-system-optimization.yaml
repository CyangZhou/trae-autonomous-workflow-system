name: 工作流系统优化
description: 优化自动化工作流系统，包括升级知识沉淀机制、添加新功能、改进触发逻辑
version: "1.0.0"
created_at: "2026-02-13"
source_task: "workflow-system-001"
success_rate: 100

triggers:
  keywords:
    - "工作流"
    - "沉淀"
    - "触发"
    - "优化"
    - "升级"
    - "知识管理"
  patterns:
    - "优化.*工作流"
    - "升级.*沉淀"
    - "添加.*触发"
    - "改进.*机制"
  project_types:
    - "python"
    - "trae"
  complexity_range:
    min: 2
    max: 6

variables:
  target_component: ""
  optimization_goal: ""

steps:
  - id: 1
    name: 分析现有系统
    action: analyze
    description: |
      分析现有工作流系统结构：
      - 读取 .trae/skills/ 目录下的 SKILL.md
      - 读取 .trae/rules/project_rules.md
      - 识别需要优化的组件
    output:
      - current_structure
      - optimization_points

  - id: 2
    name: 设计优化方案
    action: design
    description: |
      设计优化方案：
      - 确定优化目标
      - 设计新的数据结构
      - 规划触发机制
    output:
      - design_doc
      - new_structures

  - id: 3
    name: 实现优化
    action: implement
    description: |
      实现优化：
      - 更新 SKILL.md 文件
      - 创建新的模板文件
      - 更新索引文件
    output:
      - updated_files

  - id: 4
    name: 验证优化
    action: verify
    description: |
      验证优化结果：
      - 检查文件结构
      - 验证触发机制
      - 确认索引更新
    output:
      - verification_result

learnings:
  - lesson: "触发条件需要多维度设计"
    solution: "使用关键词+模式+项目类型+复杂度四维触发条件"
  - lesson: "项目专属工作流优先级应高于通用工作流"
    solution: "在 intelligent-workflow-assistant 中优先匹配项目专属工作流"

validation_rules:
  - name: 文件完整性
    description: 所有新建文件必须存在且内容完整
    critical: true
  - name: 索引一致性
    description: index.json 必须包含所有新增条目
    critical: true

metadata:
  author: "autonomous-agent"
  last_used: "2026-02-13"
  use_count: 1
  avg_execution_time: "5分钟"
